<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>SmartBot — AI Assistant</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#090b10;--p:#11141b;--p2:#171b23;--line:#262c37;--t:#f5f7fa;--m:#929aa9;--a:#8b7cff}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(circle at 70% -10%,#8b7cff1f,transparent 36%),var(--bg);color:var(--t);font:14px "DM Sans",sans-serif}button,textarea{font:inherit}button{cursor:pointer}.app{display:flex;height:100vh}.side{width:275px;border-right:1px solid var(--line);background:#0c0e13f2;padding:16px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:8px 7px 18px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#8b7cff,#b9b0ff);display:grid;place-items:center;font-weight:800}.brand b{font:800 19px Manrope}.brand b span{color:#a89dff}.new{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#171b23;color:white;text-align:left;font-weight:600}.label{font-size:10px;color:#707888;letter-spacing:.13em;text-transform:uppercase;margin:23px 8px 7px}.history{flex:1;overflow:auto}.history button{display:block;width:100%;border:0;background:transparent;color:#cbd0d8;text-align:left;padding:10px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover,.history .active{background:#191d25;color:#fff}.profile{border-top:1px solid var(--line);padding:13px 7px;color:#cfd4dc}.profile small{display:block;color:#737c8c;margin-top:3px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#090b10b8;backdrop-filter:blur(14px)}.pill{padding:7px 10px;border:1px solid var(--line);background:#141820;border-radius:999px;font-size:11px;color:#c6cbd4}.icons{display:flex;gap:5px}.icon{border:0;background:transparent;color:#9ba3b1;width:35px;height:35px;border-radius:9px}.icon:hover{background:#171b23;color:white}.chat{flex:1;overflow:auto}.welcome{height:100%;display:grid;place-items:center;padding:25px}.hero{text-align:center;max-width:780px}.eyebrow{display:inline-block;color:#b4aaff;background:#8b7cff12;border:1px solid #8b7cff35;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.hero h1{font:800 clamp(35px,5vw,58px) Manrope;letter-spacing:-2.5px;margin:18px 0 12px}.grad{background:linear-gradient(90deg,#fff,#a79bff,#6ee7d8);color:transparent;background-clip:text}.hero p{color:var(--m);line-height:1.65;max-width:620px;margin:auto}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:27px}.card{padding:14px;text-align:left;border:1px solid var(--line);background:#12161e;border-radius:14px;color:#dfe3e8}.card:hover{background:#171b23;border-color:#444c5b}.card b{display:block;font-size:13px;margin-bottom:4px}.card span{font-size:11px;color:var(--m)}.msgs{max-width:900px;margin:auto;padding:28px 22px 150px}.msg{display:flex;gap:13px;margin-bottom:25px}.msg.user{justify-content:flex-end}.bubble{max-width:80%;line-height:1.7}.user .bubble{background:#1b1f28;border:1px solid #2b313c;padding:12px 15px;border-radius:17px 17px 5px 17px}.bot .bubble{padding-top:2px}.av{width:31px;height:31px;flex:none;border-radius:9px;background:#181d27;display:grid;place-items:center;color:#b5abff;font-size:11px;font-weight:800}.composerWrap{position:fixed;bottom:0;left:275px;right:0;padding:18px 20px;background:linear-gradient(transparent,var(--bg) 38%);pointer-events:none}.composer{max-width:900px;margin:auto;background:#12161e;border:1px solid #2a303b;border-radius:18px;overflow:hidden;box-shadow:0 24px 80px #0008;pointer-events:auto}.chips{padding:8px 10px 0;display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 9px;background:#1a1f28;border:1px solid var(--line);border-radius:999px;font-size:10px}.input{width:100%;min-height:55px;max-height:180px;resize:none;background:transparent;color:white;border:0;outline:0;padding:14px 15px 6px}.bottom{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px}.tools{display:flex;gap:4px}.tool{border:0;background:transparent;color:#8e97a6;padding:7px 8px;border-radius:8px;font-size:11px}.tool:hover,.tool.on{background:#8b7cff12;color:#b0a6ff}.send{width:36px;height:36px;border:0;border-radius:11px;background:#f2f3f5;color:#111;font-weight:800}.send:disabled{opacity:.3}.status{position:fixed;right:18px;top:72px;background:#161b23;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:#adb4c0;font-size:11px;display:none}.status.show{display:block}.menu{display:none}@media(max-width:760px){.side{position:fixed;z-index:30;left:-285px;top:0;bottom:0;transition:.2s}.side.open{left:0}.menu{display:block}.composerWrap{left:0;padding:11px 9px}.top{padding:0 10px}.msgs{padding:20px 13px 145px}.bubble{max-width:88%}.cards{grid-template-columns:1fr}.hero h1{letter-spacing:-1.7px}}
.hidden{display:none!important}pre{background:#0b0e13;border:1px solid #252b35;padding:12px;border-radius:10px;overflow:auto}code{font-family:ui-monospace,SFMono-Regular,monospace}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">✦</div><b>Smart<span>Bot</span></b></div><button class="new" id="new">＋ New chat</button><div class="label">Recent chats</div><div class="history" id="history"></div><div class="profile"><b>Personal workspace</b><small>Conversations saved locally</small></div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:8px"><button class="icon menu" id="menu">☰</button><div class="pill">SmartBot • General AI</div></div><div class="icons"><button class="icon" id="clear">⌫</button></div></header><section class="chat" id="chat"><div class="welcome" id="welcome"><div class="hero"><h1 style="font-size:32px;letter-spacing:-1.2px">How can I help you?</h1><p style="font-size:14px">Ask anything. Your conversations will appear here.</p></div></div><div class="msgs hidden" id="msgs"></div></section><div class="status" id="status"></div><div class="composerWrap"><div class="composer"><div class="chips" id="chips"></div><textarea class="input" id="input" placeholder="Message SmartBot…" rows="1"></textarea><div class="bottom"><div class="tools"><button class="tool" id="attach">＋ Attach</button><input type="file" id="files" class="hidden" multiple><button class="tool" id="web">⌁ Web search</button><button class="tool" id="voice">◉ Voice</button></div><div style="display:flex;align-items:center;gap:8px"><span style="font-size:9px;color:#697180">Enter to send</span><button class="send" id="send" disabled>↑</button></div></div></div></div></main></div>
<script>
const $=s=>document.querySelector(s),S={chats:JSON.parse(localStorage.smartbot||"[]"),cur:null,files:[],web:false};
const save=()=>localStorage.smartbot=JSON.stringify(S.chats);
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function md(s){let x=esc(s);x=x.replace(/```([\s\S]*?)```/g,"<pre><code>$1</code></pre>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");return x.replace(/\n\n/g,"<br><br>").replace(/\n/g,"<br>")}
function hist(){let h=$("#history");h.innerHTML="";[...S.chats].reverse().forEach(c=>{let b=document.createElement("button");b.textContent=c.title||"New chat";b.className=c.id===S.cur?.id?"active":"";b.onclick=()=>open(c.id);h.append(b)})}
function render(){let m=$("#msgs");m.innerHTML="";if(!S.cur?.messages.length){$("#welcome").classList.remove("hidden");m.classList.add("hidden");return}$("#welcome").classList.add("hidden");m.classList.remove("hidden");S.cur.messages.forEach(x=>{let d=document.createElement("div");d.className="msg "+(x.role==="assistant"?"bot":"user");d.innerHTML=x.role==="assistant"?'<div class="av">✦</div><div class="bubble">'+md(x.text)+"</div>":'<div class="bubble">'+md(x.text)+"</div>";m.append(d)});$("#chat").scrollTop=$("#chat").scrollHeight}
function newChat(){S.cur={id:crypto.randomUUID(),title:"New chat",messages:[],previousResponseId:null};S.chats.push(S.cur);save();hist();render();$("#input").focus()}
function open(id){S.cur=S.chats.find(x=>x.id===id)||S.cur;hist();render();$("#side").classList.remove("open")}
function status(t){let e=$("#status");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function resize(){let i=$("#input");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,180)+"px";$("#send").disabled=!i.value.trim()&&!S.files.length}
function chips(){let c=$("#chips");c.innerHTML=S.files.map((f,i)=>`<span class="chip">${esc(f.name)} <button data-i="${i}" style="border:0;background:none;color:#888">×</button></span>`).join("");resize()}
async function upload(file){let f=new FormData;f.append("file",file);let r=await fetch("/api/upload",{method:"POST",body:f}),d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function send(text){text=(text??$("#input").value).trim();if(!text&&!S.files.length)return;if(!S.cur)newChat();let fs=S.files.slice();S.files=[];chips();$("#input").value="";resize();S.cur.messages.push({role:"user",text:text||"Analyze the attached file."});if(S.cur.title==="New chat")S.cur.title=(text||"File analysis").slice(0,40);S.cur.messages.push({role:"assistant",text:""});let bot=S.cur.messages.at(-1);hist();render();save();try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text||"Analyze the attached file.",previousResponseId:S.cur.previousResponseId,fileIds:fs.map(x=>x.id),webSearch:S.web})});if(!r.ok){let e=await r.json();throw Error(e.error)}let rd=r.body.getReader(),dec=new TextDecoder(),buf="";while(1){let q=await rd.read();if(q.done)break;buf+=dec.decode(q.value,{stream:true});let parts=buf.split("\\n\\n");buf=parts.pop();for(let p of parts){let ev=(p.match(/^event: (.*)$/m)||[])[1],da=(p.match(/^data: (.*)$/m)||[])[1];if(!da)continue;let o=JSON.parse(da);if(ev==="delta"){bot.text+=o.text||"";render()}if(ev==="done")S.cur.previousResponseId=o.responseId||null;if(ev==="error")throw Error(o.message)}}}catch(e){bot.text="I couldn't complete that request: "+e.message;render()}save();hist()}
$("#new").onclick=newChat;$("#clear").onclick=()=>{if(S.cur){S.cur.messages=[];S.cur.previousResponseId=null;save();render()}};$("#input").oninput=resize;$("#input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("#send").onclick=()=>send();document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>send(b.dataset.p));$("#menu").onclick=()=>$("#side").classList.toggle("open");$("#attach").onclick=()=>$("#files").click();$("#files").onchange=async e=>{for(let f of [...e.target.files].slice(0,5)){try{status("Uploading "+f.name+"…");S.files.push(await upload(f))}catch(x){status(x.message)}}e.target.value="";chips()};$("#chips").onclick=e=>{let b=e.target.closest("[data-i]");if(b){S.files.splice(+b.dataset.i,1);chips()}};$("#web").onclick=()=>{S.web=!S.web;$("#web").classList.toggle("on",S.web);status(S.web?"Web search enabled":"Web search disabled")};$("#voice").onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return status("Voice input is not supported here.");let r=new R;r.lang=navigator.language||"en-US";r.onstart=()=>status("Listening…");r.onresult=e=>{$("#input").value=[...e.results].map(x=>x[0].transcript).join("");resize()};r.start()};
(async()=>{try{let r=await fetch("/api/health"),d=await r.json();if(!d.configured)status("Add OPENAI_API_KEY to .env for live AI.")}catch{}if(!S.chats.length)newChat();else{S.cur=S.chats.at(-1);hist();render()}})();
</script></body></html>
